    <script>
      ;(function () {
        var pathSegmentsToKeep = 1
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('/')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('/')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })()
    </script>
  </head>
  <body>
    <script>
      // Theme initialization - runs before React to prevent flash
      ;(function () {
        try {
          var stored = localStorage.getItem('preferences')
          var theme = 'auto'
          if (stored) {
            var parsed = JSON.parse(stored)
            theme = parsed.state?.theme || 'auto'
          }
          var isDark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) {
            document.documentElement.classList.add('dark')
          }
          // Detect language
          var lang = stored ? JSON.parse(stored).state?.language : null
          if (!lang) {
            lang = navigator.language.startsWith('zh') ? 'zh-CN' : 'en-US'
          }
          document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
